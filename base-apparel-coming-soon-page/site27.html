<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/site27.css">
    <link rel="icon" href="Images/favicon-32x32.png">
</head>
<body>
    <main>
        
        <div class="left">
            <header>
                <img src="Images/logo.svg" alt="">
            </header>

            <div class="content">
                <h1>
                    <span>WE'RE</span>
                    <span class="b">COMING</span>
                    <span class="b">SOON</span>
                </h1>

                <p>Hello fellow shoppers! We're currently building our new fashion store. Add your email below to stay up-to-date with announcements and our launch deals</p>                
                <div class="wrapper">
                    <div class="input-container">
                        <form action="" novalidate autocomplete="off">
                            <input type="email" placeholder="Email Address">

                            <div class="button-container">
                                <img src="Images/icon-error.svg" alt="" width="20" class="errorIcon"
                                >
                                <button type="submit" class="submitBtn">
                                    <img src="Images/icon-arrow.svg" alt="" width="10">
                                </button>                             
                            </div>
                        
                        </form>

                    </div>
                    <p class="error-text">Please provide a valid email</p>                    
                </div>

            </div>


            <img src="Images/bg-pattern-desktop.svg" alt="" class="pattern">
        </div>

        <div class="right">
            <picture>
                <source media="(max-width: 600px)" srcset="Images/hero-mobile.jpg">

                <img src="Images/hero-desktop.jpg" alt="">
            </picture>
        </div>
    </main>
    
    <script src="script.js"></script>
</body>
</html>
